services:
  postgres:
    image: docker.1ms.run/postgres:15-alpine
    security_opt:
      - seccomp:unconfined
    environment:
      POSTGRES_DB: talent_docs
      POSTGRES_USER: talent
      POSTGRES_PASSWORD: talent_dev_password
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talent -d talent_docs"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: docker.1panel.live/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: talent_minio
      MINIO_ROOT_PASSWORD: talent_minio_password
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: docker.1ms.run/redis:6-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20

  milvus:
    image: milvusdb/milvus:v2.6.17
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: talent_minio
      MINIO_SECRET_ACCESS_KEY: talent_minio_password
    ports:
      - "127.0.0.1:19531:19530"
      - "127.0.0.1:19091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30

  backend:
    profiles: ["app"]
    image: talent-eval-agents-course-backend:latest
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://talent:talent_dev_password@postgres:5432/talent_docs
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://127.0.0.1:19000
      S3_ACCESS_KEY: talent_minio
      S3_SECRET_KEY: talent_minio_password
      S3_BUCKET: talent-documents
      MINERU_URL: http://host.docker.internal:18001
      MILVUS_URI: http://milvus:19530
      MILVUS_TOKEN: root:Milvus
      MILVUS_COLLECTION: talent_evidence_v2
      EMBEDDING_DIMENSION: 1024
      LOG_DIR: /app/logs
      SERVICE_NAME: backend
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:18080:18080"
    volumes:
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy

  worker:
    profiles: ["app"]
    image: talent-eval-agents-course-backend:latest
    build: ./backend
    env_file:
      - .env
    command: ["uv", "run", "python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://talent:talent_dev_password@postgres:5432/talent_docs
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://127.0.0.1:19000
      S3_ACCESS_KEY: talent_minio
      S3_SECRET_KEY: talent_minio_password
      S3_BUCKET: talent-documents
      MINERU_URL: http://host.docker.internal:18001
      MILVUS_URI: http://milvus:19530
      MILVUS_TOKEN: root:Milvus
      MILVUS_COLLECTION: talent_evidence_v2
      EMBEDDING_DIMENSION: 1024
      LOG_DIR: /app/logs
      SERVICE_NAME: worker
      TZ: Asia/Shanghai
    volumes:
      - ./backend/logs:/app/logs
    depends_on:
      backend:
        condition: service_started

  frontend:
    profiles: ["app"]
    build: ./frontend
    ports:
      - "127.0.0.1:15173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  etcd_data:
  milvus_data:
